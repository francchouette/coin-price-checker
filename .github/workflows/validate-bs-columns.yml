name: "[BS0] Validate Sheet Columns"

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      compare:
        description: 'ヘッダー比較表示'
        type: boolean
        default: false

  # PRで列関連ファイルが変更された時に自動実行
  pull_request:
    paths:
      - 'src/bs_sheet_columns.py'
      - 'src/bs_validate_columns.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show column mapping
        run: |
          echo "=== 列定義マッピング ==="
          python -m src.bs_validate_columns --show-mapping

      - name: Validate columns
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          if [ "${{ inputs.compare }}" = "true" ]; then
            python -m src.bs_validate_columns --compare
          else
            python -m src.bs_validate_columns
          fi
