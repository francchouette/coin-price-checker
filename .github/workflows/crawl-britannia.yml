name: Crawl Britannia

on:
  # 週1回実行（毎週月曜日 JST 10:00 = UTC 1:00）
  schedule:
    - cron: '0 1 * * 1'

  # 手動実行を許可
  workflow_dispatch:
    inputs:
      category:
        description: '取得するカテゴリ'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'gold-coins'
          - 'silver-coins'

jobs:
  # 金貨カテゴリ
  crawl-gold:
    if: ${{ github.event.inputs.category == 'all' || github.event.inputs.category == 'gold-coins' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Crawl gold-coins
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python -m src.crawl_britannia --category=gold-coins

  # 銀貨カテゴリ
  crawl-silver:
    if: ${{ github.event.inputs.category == 'all' || github.event.inputs.category == 'silver-coins' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Crawl silver-coins
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python -m src.crawl_britannia --category=silver-coins

  # 完了通知
  notify:
    needs: [crawl-gold, crawl-silver]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          echo "Gold coins job: ${{ needs.crawl-gold.result }}"
          echo "Silver coins job: ${{ needs.crawl-silver.result }}"

      - name: Notify on failure
        if: contains(needs.*.result, 'failure')
        run: |
          echo "❌ Some jobs failed!"
          exit 1
