name: "[BS-TEST] Test BS Scripts Refactoring"

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'テスト対象'
        type: choice
        required: true
        default: 'all'
        options:
          - 'all'
          - 'bullionstar_products'
          - 'register_adopted_products'
          - 'upload_images'
          - 'generate_names'
      dry_run:
        description: 'ドライラン（実際の変更なし）'
        type: boolean
        default: true
      limit:
        description: '処理件数制限'
        type: string
        default: '3'

jobs:
  test-refactoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: inputs.test_target == 'all' || inputs.test_target == 'bullionstar_products' || inputs.test_target == 'upload_images'
        run: |
          playwright install chromium
          playwright install-deps chromium

      # テスト1: 列定義検証
      - name: Validate column definitions
        run: |
          echo "=== 列定義検証 ==="
          python -m src.bs_validate_columns
          echo "✅ 列定義検証成功"

      # テスト2: bullionstar_products.py
      - name: Test bullionstar_products.py
        if: inputs.test_target == 'all' || inputs.test_target == 'bullionstar_products'
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
        run: |
          echo "=== bullionstar_products.py テスト ==="
          ARGS="--limit ${{ inputs.limit }}"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            ARGS="$ARGS --fetch-prices"
          fi
          python -m src.bullionstar_products $ARGS
          echo "✅ bullionstar_products.py テスト成功"

      # テスト3: register_adopted_products.py
      - name: Test register_adopted_products.py
        if: inputs.test_target == 'all' || inputs.test_target == 'register_adopted_products'
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
        run: |
          echo "=== register_adopted_products.py テスト ==="
          ARGS="--limit ${{ inputs.limit }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          ARGS="$ARGS --skip-sync"
          python -m src.register_adopted_products $ARGS
          echo "✅ register_adopted_products.py テスト成功"

      # テスト4: generate_cm_product_names.py
      - name: Test generate_cm_product_names.py
        if: inputs.test_target == 'all' || inputs.test_target == 'generate_names'
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== generate_cm_product_names.py テスト ==="
          ARGS="--limit ${{ inputs.limit }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.generate_cm_product_names $ARGS
          echo "✅ generate_cm_product_names.py テスト成功"

      # テスト5: upload_bullionstar_images.py（ドライランのみ）
      - name: Test upload_bullionstar_images.py
        if: (inputs.test_target == 'all' || inputs.test_target == 'upload_images') && inputs.dry_run == true
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          echo "=== upload_bullionstar_images.py テスト（status確認のみ）==="
          python -m src.upload_bullionstar_images --status || true
          echo "✅ upload_bullionstar_images.py インポートテスト成功"

      - name: Summary
        run: |
          echo "========================================"
          echo "  リファクタリングテスト完了"
          echo "========================================"
          echo "  対象: ${{ inputs.test_target }}"
          echo "  ドライラン: ${{ inputs.dry_run }}"
          echo "  件数制限: ${{ inputs.limit }}"
          echo "========================================"
