name: Register to ColorMe

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '登録件数制限（空欄で全件）'
        required: false
        default: ''
        type: string
      upload_images:
        description: '画像もアップロード'
        required: false
        default: true
        type: boolean
      upload_limit:
        description: '画像アップロード件数制限（空欄で全件）'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'ドライラン（実際の登録なし）'
        required: false
        default: false
        type: boolean

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: ${{ inputs.upload_images == true && inputs.dry_run == false }}
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Register adopted products to ColorMe
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.register_adopted_products $ARGS

      - name: Upload images for registered products
        if: ${{ inputs.upload_images == true && inputs.dry_run == false }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
          COLORME_LOGIN_ID: ${{ secrets.COLORME_LOGIN_ID }}
          COLORME_PASSWORD: ${{ secrets.COLORME_PASSWORD }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.upload_limit }}" ]; then
            ARGS="$ARGS --max-per-run ${{ inputs.upload_limit }}"
          fi
          python -m src.upload_bullionstar_images $ARGS
