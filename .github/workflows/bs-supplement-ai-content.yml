name: "[BS2] 欠損データ補完（AI生成・為替）"

on:
  workflow_dispatch:
    inputs:
      target:
        description: '生成対象'
        type: choice
        required: true
        default: 'all'
        options:
          - 'all'
          - 'name'
          - 'exchange'
          - 'category'
          - 'model'
          - 'description'
          - 'seo'
      exchange_type:
        description: '為替種類'
        type: choice
        required: false
        default: 'クレカ'
        options:
          - 'クレカ'
          - 'Wise'
      dry_run:
        description: 'ドライラン（実際の変更なし）'
        type: boolean
        default: true
      limit:
        description: '処理件数制限（空欄で全件）'
        type: string
        default: ''

jobs:
  supplement-ai-content:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6時間

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Supplement AI Content
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          echo "=== AI生成コンテンツ補完 ==="
          echo "対象: ${{ inputs.target }}"
          echo "為替種類: ${{ inputs.exchange_type }}"
          echo "ドライラン: ${{ inputs.dry_run }}"
          echo "件数制限: ${{ inputs.limit || '全件' }}"
          echo ""

          ARGS="--target ${{ inputs.target }}"
          ARGS="$ARGS --exchange-type ${{ inputs.exchange_type }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi

          python -m src.bs_supplement_ai_content $ARGS

          echo ""
          echo "✅ AI生成コンテンツ補完完了"

      - name: Summary
        run: |
          echo "========================================"
          echo "  AI生成コンテンツ補完完了"
          echo "========================================"
          echo "  対象: ${{ inputs.target }}"
          echo "  為替種類: ${{ inputs.exchange_type }}"
          echo "  ドライラン: ${{ inputs.dry_run }}"
          echo "  件数制限: ${{ inputs.limit || '全件' }}"
          echo "========================================"
