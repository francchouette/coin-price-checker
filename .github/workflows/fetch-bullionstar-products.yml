name: Bullionstar Products

on:
  # schedule:
  #   # 毎日 JST 10:00 (UTC 01:00) に実行
  #   - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '特定カテゴリのみ取得（空欄で全カテゴリ）'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Gold
          - Silver
          - Platinum
          - Copper
          - Jewellery
          - Supplies
          - Bullion Savings Program
          - Auctions
      fetch_prices:
        description: '価格・在庫もスクレイピングで取得（時間がかかります）'
        required: false
        default: false
        type: boolean
      limit:
        description: '価格取得の件数制限（テスト用、空欄で全件）'
        required: false
        default: ''
        type: string
      register_adopted:
        description: '採用商品をカラーミーに登録（A列=採用の商品）'
        required: false
        default: false
        type: boolean
      register_limit:
        description: '登録件数制限（空欄で全件）'
        required: false
        default: ''
        type: string
      upload_images:
        description: '登録した商品の画像をアップロード'
        required: false
        default: false
        type: boolean
      upload_limit:
        description: '画像アップロード件数制限（空欄で全件）'
        required: false
        default: ''
        type: string

jobs:
  fetch-products:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: ${{ inputs.fetch_prices == true || inputs.upload_images == true }}
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch Bullionstar products
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="-v"
          if [ -n "${{ inputs.category }}" ]; then
            ARGS="$ARGS --category \"${{ inputs.category }}\""
          fi
          if [ "${{ inputs.fetch_prices }}" == "true" ]; then
            ARGS="$ARGS --fetch-prices"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          python -m src.bullionstar_products $ARGS

      - name: Register adopted products to ColorMe
        if: ${{ inputs.register_adopted == true }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.register_limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.register_limit }}"
          fi
          python -m src.register_adopted_products $ARGS

      - name: Upload images for registered products
        if: ${{ inputs.upload_images == true }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
          COLORME_LOGIN_ID: ${{ secrets.COLORME_LOGIN_ID }}
          COLORME_PASSWORD: ${{ secrets.COLORME_PASSWORD }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.upload_limit }}" ]; then
            ARGS="$ARGS --max-per-run ${{ inputs.upload_limit }}"
          fi
          python -m src.upload_bullionstar_images $ARGS
