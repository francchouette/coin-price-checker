name: Bullionstar Products

on:
  schedule:
    # 毎日 JST 10:00 (UTC 01:00) に実行
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '特定カテゴリのみ取得（空欄で全カテゴリ）'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Gold
          - Silver
          - Platinum
          - Copper
          - Jewellery
          - Supplies
          - Bullion Savings Program
          - Auctions
      dry_run:
        description: 'ドライラン（スプレッドシートに保存しない）'
        required: false
        default: false
        type: boolean

jobs:
  fetch-products:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Fetch Bullionstar products
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          ARGS="-v"
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.category }}" ]; then
            ARGS="$ARGS --category ${{ inputs.category }}"
          fi
          python -m src.bullionstar_products $ARGS
