name: "[BS1] Bullionstar Products"

on:
  schedule:
    # 6時間10分毎に実行（GitHub Actionsの6時間タイムアウトを考慮）
    # JST 10:00 (UTC 01:00)
    - cron: '0 1 * * *'
    # JST 16:10 (UTC 07:10)
    - cron: '10 7 * * *'
    # JST 22:20 (UTC 13:20)
    - cron: '20 13 * * *'
    # JST 04:30 (UTC 19:30)
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '特定カテゴリのみ取得（空欄で全カテゴリ）'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Gold
          - Silver
          - Platinum
          - Copper
          - Jewellery
          - Supplies
          - Bullion Savings Program
          - Auctions
      limit:
        description: '取得件数制限（テスト用、空欄で全件）'
        required: false
        default: ''
        type: string
      auto_continue:
        description: '自動継続モード（内部用）'
        required: false
        default: 'false'
        type: string

jobs:
  fetch-products:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub Actionsの最大値（6時間）

    permissions:
      contents: read
      id-token: write
      actions: write  # ワークフロー再起動に必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch Bullionstar products
        id: fetch
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="-v --fetch-prices"
          if [ -n "${{ inputs.category }}" ]; then
            ARGS="$ARGS --category \"${{ inputs.category }}\""
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi

          # 実行結果をファイルに出力
          python -m src.bullionstar_products $ARGS 2>&1 | tee /tmp/fetch_output.log

          # 新規追加件数を抽出（"新規追加: XX件" のパターン）
          NEW_COUNT=$(grep -oP '新規追加: \K\d+' /tmp/fetch_output.log | tail -1 || echo "0")
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          echo "新規追加件数: $NEW_COUNT"

      - name: Check if continuation needed
        id: check_continue
        if: ${{ inputs.limit == '' }}
        run: |
          # 新規追加が1件以上あれば、まだ未処理の商品がある可能性が高い
          if [ "${{ steps.fetch.outputs.new_count }}" -gt "0" ]; then
            echo "should_continue=true" >> $GITHUB_OUTPUT
            echo "未処理の商品が残っている可能性があります。継続実行をトリガーします。"
          else
            echo "should_continue=false" >> $GITHUB_OUTPUT
            echo "全商品の処理が完了しました。"
          fi

      - name: Trigger continuation workflow
        if: ${{ steps.check_continue.outputs.should_continue == 'true' && inputs.limit == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ワークフローを再起動して未処理の商品を継続処理します..."
          gh workflow run fetch-bullionstar-products.yml \
            -f category="${{ inputs.category }}" \
            -f auto_continue="true"
          echo "継続ワークフローをトリガーしました。"
