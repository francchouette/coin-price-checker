name: "BS2 Add to ColorMe"

on:
  # 手動実行を許可
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（実際の登録なし）'
        type: boolean
        default: false
      limit:
        description: '処理件数制限（空欄で全件）'
        type: string
        default: ''
      skip_sync:
        description: '仕入れ先一覧同期をスキップ'
        type: boolean
        default: false
      skip_images:
        description: '画像アップロードをスキップ'
        type: boolean
        default: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: inputs.skip_images != true && inputs.dry_run != true
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run register adopted products
        id: register
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.skip_sync }}" = "true" ]; then
            ARGS="$ARGS --skip-sync"
          fi
          python -m src.register_adopted_products $ARGS

      - name: Upload images for registered products
        if: inputs.skip_images != true && inputs.dry_run != true
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
          COLORME_LOGIN_ID: ${{ secrets.COLORME_LOGIN_ID }}
          COLORME_PASSWORD: ${{ secrets.COLORME_PASSWORD }}
        run: |
          echo "=== 画像アップロード開始 ==="
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --max-per-run ${{ inputs.limit }}"
          fi
          python -m src.upload_bullionstar_images $ARGS
