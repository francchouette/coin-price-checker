name: Fetch APMEX Categories

on:
  workflow_dispatch:
    inputs:
      parent_group_id:
        description: '親グループID（APMEX用の親グループ、0でルート）'
        required: false
        default: '0'
      dry_run:
        description: 'ドライラン（プレビューのみ）'
        required: false
        default: true
        type: boolean
      fetch_only:
        description: 'カテゴリー取得のみ（カラーミー登録しない）'
        required: false
        default: false
        type: boolean

jobs:
  fetch-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Fetch APMEX categories (fetch only)
        if: inputs.fetch_only == true
        env:
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
        run: |
          python -m src.apmex_categories --fetch-only -v

      - name: Fetch and register categories (dry run)
        if: inputs.fetch_only == false && inputs.dry_run == true
        env:
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
        run: |
          python -m src.apmex_categories --dry-run --parent-group-id ${{ inputs.parent_group_id }} -v

      - name: Fetch and register categories
        if: inputs.fetch_only == false && inputs.dry_run == false
        env:
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
          COLORME_ACCESS_TOKEN: ${{ secrets.COLORME_ACCESS_TOKEN }}
        run: |
          python -m src.apmex_categories --parent-group-id ${{ inputs.parent_group_id }} -v
