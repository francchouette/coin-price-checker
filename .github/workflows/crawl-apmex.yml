name: Crawl APMEX

on:
  # 週1回実行（毎週水曜日 JST 10:00 = UTC 1:00）
  schedule:
    - cron: '0 1 * * 3'

  # 手動実行を許可
  workflow_dispatch:
    inputs:
      category:
        description: '取得するカテゴリ'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'gold-coins'
          - 'silver-coins'
      reset:
        description: '進捗をリセットして最初から取得'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_pages:
        description: '最大ページ数（テスト用）'
        required: false
        default: ''
        type: string

jobs:
  # 金貨カテゴリ
  crawl-gold:
    if: ${{ github.event.inputs.category == 'all' || github.event.inputs.category == 'gold-coins' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120  # APMEXはボット対策で時間がかかる可能性があるため長めに設定

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Crawl gold-coins
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          RESET_FLAG=""
          MAX_PAGES_FLAG=""
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then
            RESET_FLAG="--reset"
          fi
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            MAX_PAGES_FLAG="--max-pages=${{ github.event.inputs.max_pages }}"
          fi
          python -m src.crawl_apmex --category=gold-coins $RESET_FLAG $MAX_PAGES_FLAG

  # 銀貨カテゴリ
  crawl-silver:
    if: ${{ github.event.inputs.category == 'all' || github.event.inputs.category == 'silver-coins' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Crawl silver-coins
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          RESET_FLAG=""
          MAX_PAGES_FLAG=""
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then
            RESET_FLAG="--reset"
          fi
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            MAX_PAGES_FLAG="--max-pages=${{ github.event.inputs.max_pages }}"
          fi
          python -m src.crawl_apmex --category=silver-coins $RESET_FLAG $MAX_PAGES_FLAG

  # 完了通知
  notify:
    needs: [crawl-gold, crawl-silver]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          echo "Gold coins job: ${{ needs.crawl-gold.result }}"
          echo "Silver coins job: ${{ needs.crawl-silver.result }}"

      - name: Notify on failure
        if: contains(needs.*.result, 'failure')
        run: |
          echo "APMEX crawl failed. This may be due to bot detection."
          echo "Consider running with a smaller max_pages or checking the site manually."
          exit 1
