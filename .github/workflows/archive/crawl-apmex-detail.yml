name: Crawl APMEX Detail

on:
  # 手動実行のみ
  workflow_dispatch:
    inputs:
      max_items:
        description: '最大取得件数'
        required: false
        default: '20'
        type: choice
        options:
          - '10'
          - '20'
          - '30'
          - '50'

jobs:
  fetch-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Fetch product details
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
        run: |
          python -m src.crawl_apmex --detail --max-items=${{ github.event.inputs.max_items || '20' }}
