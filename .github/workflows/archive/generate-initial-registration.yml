name: Generate Initial Registration

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      max_items:
        description: '処理する最大件数（空の場合は全件）'
        required: false
        default: ''
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Generate initial registration list
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MAX_ITEMS_FLAG=""
          if [ -n "${{ github.event.inputs.max_items }}" ]; then
            MAX_ITEMS_FLAG="--max-items=${{ github.event.inputs.max_items }}"
          fi
          python -m src.generate_initial_registration $MAX_ITEMS_FLAG
