name: Reset Spreadsheet Row

on:
  workflow_dispatch:
    inputs:
      row_number:
        description: 'リセットする行番号（2以上）'
        required: true
        type: number
      dry_run:
        description: 'ドライラン（プレビューのみ）'
        required: false
        default: false
        type: boolean

jobs:
  reset-row:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/613320899872/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'spreadsheet-access@coin-price-tracker-479614.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      - name: Reset row (dry run)
        if: inputs.dry_run == true
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/reset_row.py ${{ inputs.row_number }} --dry-run

      - name: Reset row
        if: inputs.dry_run == false
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/reset_row.py ${{ inputs.row_number }}
